name: Lint and Test Charts

on: pull_request

permissions: {}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --charts . --lint-conf lintconf.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0

      - name: Install Gateway API CRDs
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/$GATEWAY_CRD_VERSION/standard-install.yaml
        env:
          GATEWAY_CRD_VERSION: v1.6.3 # renovate: datasource=github-tags depName=kubernetes-sigs/gateway-api

      - name: Run chart-testing (install)
        run: ct install --charts . --upgrade --target-branch ${{ github.event.repository.default_branch }}